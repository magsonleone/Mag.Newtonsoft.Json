name: Publish GitHub Package

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build package
        shell: powershell
        run: .\Build\localbuild.ps1

      - name: Configure GitHub Packages source
        shell: powershell
        run: dotnet nuget add source "https://nuget.pkg.github.com/magsonleone/index.json" --name github --username magsonleone --password "${{ secrets.GITHUB_TOKEN }}" --store-password-in-clear-text

      - name: Publish package
        shell: powershell
        run: |
          $packages = Get-ChildItem -Path .\Working\NuGet -Filter *.nupkg | Where-Object { $_.Name -notlike "*.symbols.nupkg" }
          if ($packages.Count -eq 0) {
            throw "No NuGet packages were produced."
          }
          foreach ($package in $packages) {
            dotnet nuget push $package.FullName --source github --api-key "${{ secrets.GITHUB_TOKEN }}" --skip-duplicate
          }
